services:
  - type: web
    name: cognitivemesh-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: USE_DATABASE
        value: "false"
      - key: GROQ_API_KEY
        sync: false   # set this manually in the Render dashboard (keeps it secret)
